---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.73.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_KEY
              value: /badger/keys
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/values
            - name: BADGER_SPAN_STORE_TTL
              value: 24h
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: GOMEMLIMIT
              value: 1800MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: grpc-legacy
              containerPort: 14250
            - name: http-legacy
              containerPort: 14268
            - name: admin
              containerPort: 14269
            - name: query
              containerPort: 16686
          readinessProbe:
            tcpSocket:
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 14269
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: badger
              mountPath: /badger
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: badger
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: grpc-legacy
      port: 14250
      targetPort: 14250
    - name: http-legacy
      port: 14268
      targetPort: 14268
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: http-query
      port: 16686
      targetPort: 16686
