---

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes repository GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /tmp/k8s-Release.key
    mode: "0644"

- name: Convert key to dearmored format
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-Release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add the official Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubeadm/kubelet/kubectl (pinned version)
  ansible.builtin.apt:
    name:
      - "kubeadm={{ k8s_version }}"
      - "kubelet={{ k8s_version }}"
      - "kubectl={{ k8s_version }}"
    state: present
    update_cache: true
  register: _k8s_pin
  failed_when: false

- name: Install latest version (only when the pinned version is missing)
  when: _k8s_pin.msg | default('') is search('No candidate|Unable to locate|Failed to install|No package matches|was not found')
  ansible.builtin.apt:
    name: [kubeadm, kubelet, kubectl]
    state: latest
    update_cache: true

- name: Hold package versions
  ansible.builtin.command: apt-mark hold kubeadm kubelet kubectl
  changed_when: false

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true

- name: Build the worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: _worker_join
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false

- name: Join workers to the cluster
  ansible.builtin.shell: "{{ _worker_join.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf

- name: Wait until every node and the Cilium pods are Ready (health evidence)
  ansible.builtin.shell: |
    set -euo pipefail
    K="--kubeconfig=/etc/kubernetes/admin.conf"
    kubectl $K get nodes -o wide
    kubectl $K wait --for=condition=Ready node --all --timeout=180s
    kubectl $K -n kube-system wait --for=condition=Ready pod -l k8s-app=cilium --timeout=300s
    kubectl $K -n kube-system get pods -o wide | grep -E 'cilium|coredns'
  args:
    executable: /bin/bash
  register: _nodes_ready
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false
  retries: 5
  delay: 30
  until: _nodes_ready.rc == 0

- name: Show node status (evidence for the report)
  ansible.builtin.debug:
    msg: "{{ _nodes_ready.stdout_lines }}"
  run_once: true
