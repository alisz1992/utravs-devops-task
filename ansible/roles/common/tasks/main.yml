---

- name: Set hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether swap is active
  ansible.builtin.set_fact:
    swap_present: "{{ (ansible_swaptotal_mb | default(0) | int) > 0 }}"

- name: Disable swap (kubelet requirement)
  ansible.builtin.command: swapoff -a
  when: swap_present | bool
  changed_when: true

- name: Comment out swap entries in fstab (prevent re-enable on reboot)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ common_kernel_modules }}"
  changed_when: false

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    content: "{{ item }}\n"
    dest: "/etc/modules-load.d/{{ item }}.conf"
    mode: "0644"
  loop: "{{ common_kernel_modules }}"

- name: Apply baseline sysctl settings (immediate + persistent)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
    state: present
  loop: "{{ common_sysctl | dict2items }}"

- name: Ensure time synchronization with chrony (required for TLS and etcd)
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

- name: Check whether the ufw unit exists
  ansible.builtin.command: systemctl is-enabled ufw
  register: _ufw_state
  changed_when: false
  failed_when: false

- name: Disable ufw (perimeter protection is handled by cloud/network firewall)
  when: _ufw_state.rc == 0
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false

- name: Map all node names in /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: "0644"
    backup: true
